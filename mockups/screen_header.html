<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mockup Header CantaAí PRO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      width: 1080px;
      height: 140px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 24px;
    }

    .header-bar {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      user-select: none;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-text span {
      color: #38bdf8;
    }
    .badge-pro {
      background: #2563eb;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    .search-box {
      flex: 1;
      max-width: 480px;
      background: #17233d;
      border: 1px solid #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
      color: #94a3b8;
    }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 13.5px;
      width: 100%;
      font-family: inherit;
    }
    .search-input::placeholder {
      color: #64748b;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-add {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .icon-btn {
      background: #17233d;
      border: 1px solid #334155;
      color: #f8fafc;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      position: relative;
      cursor: pointer;
    }

    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f172a;
    }

    .user-pill {
      background: #17233d;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 4px 12px 4px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }
    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .user-tag {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="brand-area">
      <div class="brand-icon">
        <svg viewBox="0 0 84 84" width="36" height="36" fill="none" stroke="currentColor" stroke-linecap="round">
          <line x1="42.00" y1="12.00" x2="42.00" y2="4.00" stroke="#f8fafc" stroke-width="4.5"/>
          <line x1="57.00" y1="16.02" x2="60.00" y2="10.82" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="67.98" y1="27.00" x2="73.18" y2="24.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="72.00" y1="42.00" x2="78.00" y2="42.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="67.98" y1="57.00" x2="73.18" y2="60.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="57.00" y1="67.98" x2="60.00" y2="73.18" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="42.00" y1="72.00" x2="42.00" y2="78.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="27.00" y1="67.98" x2="23.00" y2="74.91" stroke="#38bdf8" stroke-width="4.5"/>
          <line x1="16.02" y1="57.00" x2="10.82" y2="60.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="12.00" y1="42.00" x2="6.00" y2="42.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="16.02" y1="27.00" x2="10.82" y2="24.00" stroke="#f8fafc" stroke-width="2.8"/>
          <line x1="27.00" y1="16.02" x2="24.00" y2="10.82" stroke="#f8fafc" stroke-width="2.8"/>
          <path d="M33 50 L51 34" stroke="#38bdf8" stroke-width="8"/>
        </svg>
      </div>
      <div class="brand-text">Canta<span>Aí</span><span class="badge-pro">PRO</span></div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" class="search-input" value="Buscar repertório ou música..." readonly>
      <span style="font-size: 11px; background: #0f172a; padding: 2px 6px; border-radius: 4px; border: 1px solid #334155; color: #64748b;">⌘K</span>
    </div>

    <div class="header-actions">
      <button class="btn-add">
        <span>➕</span> Adicionar <span style="font-size: 10px;">▾</span>
      </button>

      <div class="icon-btn" title="Notificações & Central de Atendimento">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <div class="notif-badge">2</div>
      </div>

      <div class="icon-btn" title="Alternar Modo Escuro/Claro">
        🌙
      </div>

      <div class="user-pill">
        <div class="user-avatar">L</div>
        <span class="user-name">leovitulli@gmail.com</span>
        <span class="user-tag">VIP</span>
        <span style="font-size: 10px; color: #94a3b8;">▾</span>
      </div>
    </div>
  </div>
</body>
</html>
